<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>NL AI Skill Index — LinkedIn carousel</title>
<link href="https://fonts.googleapis.com/css2?family=Anybody:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#101214;--bg2:#171a1d;--hair:#2a2f34;--ink:#eceadf;--ink2:#b9b5a6;--ink3:#8b8779;
      --rise:#3ddc97;--fall:#ff8a5b;--neutral:#7ab8ff}
html,body{background:var(--bg)}
@page{size:1080px 1350px;margin:0}
@media print{.slide{page-break-after:always;break-after:page}}
body.one .slide{display:none}body.one .slide.show{display:flex}
body{font-family:'Anybody',sans-serif;color:var(--ink);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.slide{width:1080px;height:1350px;overflow:hidden;padding:56px 64px 48px;display:flex;flex-direction:column;
       page-break-after:always;position:relative}
.top{display:flex;justify-content:space-between;align-items:baseline;font-size:18px;letter-spacing:.14em;
     text-transform:uppercase;color:var(--ink3);padding-bottom:16px;border-bottom:2px solid var(--ink)}
.top b{color:var(--ink);font-weight:700}
.k{font-size:18px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);margin-top:40px}
h1{font-size:66px;font-weight:800;line-height:1.02;letter-spacing:-.028em;margin-top:14px;max-width:17ch}
h2{font-size:50px;font-weight:800;line-height:1.06;letter-spacing:-.025em;margin-top:12px;max-width:19ch}
.sub{margin-top:18px;font-size:23px;line-height:1.4;color:var(--ink2);max-width:42ch}
.sub b{color:var(--ink);font-weight:600}
.big{margin-top:auto}
.big .n{font-size:150px;font-weight:800;letter-spacing:-.04em;line-height:.95}
.big .n.up{color:var(--rise)} .big .n.down{color:var(--fall)}
.big .t{font-size:26px;color:var(--ink2);margin-top:12px;max-width:34ch;line-height:1.35}
.big .t b{color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:30px}
.mv{background:var(--bg2);border-left:5px solid var(--hair);padding:16px 20px 14px}
.mv.up{border-color:var(--rise)} .mv.down{border-color:var(--fall)} .mv.nt{border-color:var(--neutral)}
.mv .kk{font-size:17px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.mv .nn{margin-top:5px;font-size:36px;font-weight:800;letter-spacing:-.02em;line-height:1}
.mv.up .nn{color:var(--rise)} .mv.down .nn{color:var(--fall)} .mv.nt .nn{color:var(--neutral)}
.mv .nn small{font-size:22px;color:var(--ink2);font-weight:500;letter-spacing:0}
.mv .tt{margin-top:7px;font-size:18px;color:var(--ink2);line-height:1.3}
.rows{margin-top:26px}
.cap{display:flex;justify-content:space-between;font-size:17px;letter-spacing:.12em;text-transform:uppercase;
     color:var(--ink3);padding-bottom:10px;border-bottom:1px solid var(--hair)}
.row{display:grid;grid-template-columns:250px 1fr 96px;gap:14px;align-items:center;padding:8px 0;
     border-bottom:1px solid var(--hair);font-size:22px}
.row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-left:9px;padding:2px 7px;border-radius:2px}
.tag.up{background:rgba(61,220,151,.16);color:var(--rise)} .tag.down{background:rgba(255,138,91,.16);color:var(--fall)}
.bar{height:16px;background:var(--bg2);border-radius:2px;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink3);border-radius:2px;display:block}
.bar i.up{background:var(--rise)} .bar i.down{background:var(--fall)} .bar i.nt{background:var(--neutral)}
.vl{text-align:right;font-weight:700}
.foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--hair);display:flex;justify-content:space-between;
      font-size:17px;color:var(--ink3);letter-spacing:.06em}
.foot b{color:var(--ink);font-weight:600;letter-spacing:0;font-size:19px}
.pg{color:var(--ink3)}
.cta{margin-top:auto;border-top:2px solid var(--ink);padding-top:22px}
.cta .u{font-size:34px;font-weight:700;letter-spacing:-.01em}
.cta .s{margin-top:8px;font-size:21px;color:var(--ink2)}
</style>
</head>
<body id="deck"></body>
<script>
(function(){
function nl(x,d){return (100*x).toFixed(d==null?1:d).replace(".",",")+"%";}
function num(x,d){return Number(x).toFixed(d).replace(".",",");}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
var M=["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
function mon(m){return M[parseInt(m.slice(5,7),10)-1];}
fetch("data.json",{cache:"no-store"}).then(function(r){return r.json();}).then(function(D){
  var p=D.panel,idx=D.skill_index.adverts,sp=D.skill_index.specificity;
  var A={};idx.skills.forEach(function(r){A[r.skill]=r;});
  var m0=mon(idx.months[0]),m1=mon(idx.months[idx.months.length-1]);
  var first=function(r){return r.shares[0];},last=function(r){return r.shares[r.shares.length-1];};
  var ag=A["AI Agents"],nlp=A["NLP"],ft=A["Fine-tuning"],py=A["Python"];
  var cs=D.survival_by_cluster.slice().sort(function(a,b){return b.rmst_90-a.rmst_90;});
  var comp=D.composition.seniority.series, sen=comp.senior||[], lead=comp.lead||[];
  var SRC="Bronnen: LinkedIn en Jobbird (NL), dagelijks verzameld";
  var top=function(){return '<div class="top"><span><b>NL AI Skill Index</b></span><span>'+
    p.n_identities.toLocaleString("nl-NL")+' vacatures · '+p.n_runs+' dagelijkse metingen</span></div>';};
  var foot=function(n,N){return '<div class="foot"><span><b>hoeberigs.github.io/nl-ai-skill-index</b> · '+SRC+'</span><span class="pg">'+n+' / '+N+'</span></div>';};
  var ris=idx.skills.filter(function(r){return r.robust&&r.trend.slope_pp>0;});
  var fal=idx.skills.filter(function(r){return r.robust&&r.trend.slope_pp<0;});
  var nom=idx.skills.filter(function(r){return r.significant&&!r.robust;});
  var W=["nul","één","twee","drie","vier","vijf","zes"], w=function(n){return W[n]||String(n);};
  var namen=function(a){return a.map(function(r){return r.skill;}).join(", ").replace(/, ([^,]*)$/," en $1");};
  var N=5, S=[];

  // 1 — the state of the market, one number
  S.push(top()+'<div class="k">De Nederlandse AI-arbeidsmarkt · '+m0+' t/m '+m1+' 2026</div>'+
    '<h1>Agents zijn in vijf maanden de meest gevraagde AI-vaardigheid geworden</h1>'+
    '<p class="sub">Zes maanden lang elke dag de Nederlandse vacaturesites gemeten. Dit is wat werkgevers nu vragen, en wat er verschoof. Swipe →</p>'+
    '<div class="big"><div class="n up">'+nl(last(ag),0)+'</div><div class="t">van de Nederlandse AI-vacatures vraagt nu om <b>agents</b>. In '+m0+' was dat '+nl(first(ag),0)+'. Meer dan LLM, meer dan Python.</div></div>'+foot(1,N));

  // 2 — what shifted, in market terms
  var why={"AI Agents":"Verdubbeld in vijf maanden. De grootste verschuiving in de markt.",
           "NLP":"Het werk blijft, het woord verdwijnt: werkgevers schrijven nu ‘LLM’ of ‘agents’.",
           "Kubernetes":"Infrastructuur wordt steeds minder als eis genoemd."};
  var card=function(r){var up=r.trend.slope_pp>0;
    return '<div class="mv '+(up?"up":"down")+'"><div class="kk">'+esc(r.skill)+' · '+(up?"in opkomst":"verdwijnt")+'</div><div class="nn">'+nl(first(r),0)+' <small>→</small> '+nl(last(r),0)+
      '</div><div class="tt">'+(why[r.skill]||"")+'</div></div>';};
  S.push(top()+'<div class="k">Wat er verschoof</div><h2>Agents erin, de oude woorden eruit</h2>'+
    '<p class="sub">Aandeel van de vacatures dat de technologie noemt, '+m0+' → '+m1+'. Van de '+idx.skills.length+' gevolgde technologieën zijn dit de enige die duidelijk bewogen; de rest bleef in grote lijnen gelijk.</p>'+
    '<div class="grid2">'+ris.concat(fal).map(card).join("")+
    '<div class="mv"><div class="kk">Alle andere technologieën</div><div class="nn" style="font-size:28px;color:var(--ink2)">stabiel</div><div class="tt">LLM, Python, Azure, RAG, Fine-tuning, Computer Vision, AWS: geen duidelijke beweging in vijf maanden.</div></div>'+
    '</div>'+foot(2,N));

  // 3 — how long roles stay open
  var cal=D.calibration;
  var rows3=cs.map(function(c){var strong=c.logrank_vs_rest.p<0.05;var cls=strong?(c.rmst_90>=cs[Math.floor(cs.length/2)].rmst_90?"up":"down"):"";
    return '<div class="row"><div class="nm">'+esc(c.name)+'</div><div class="bar"><i class="'+cls+'" style="width:'+(100*c.rmst_90/cs[0].rmst_90)+'%"></i></div><div class="vl">'+num(c.rmst_90,0)+' d</div></div>';}).join("");
  S.push(top()+'<div class="k">Hoe moeilijk is het om te vinden</div><h2>Een ML Engineer vind je niet in drie weken. Uitzendwerk is in vijf dagen weg.</h2>'+
    '<p class="sub">Omdat dezelfde sites elke dag zijn vastgelegd, is van elke vacature te volgen hoe lang ze openstond. Hoe langer, hoe moeilijker de rol te vervullen is. De gemiddelde AI-vacature staat <b>'+num(cal.median_true_days,0)+' dagen</b> open.</p>'+
    '<div class="rows"><div class="cap"><span>Gemiddeld aantal dagen open, per soort rol</span><span>binnen 90 dagen</span></div>'+rows3+'</div>'+
    '<p class="sub" style="margin-top:22px;font-size:19px">Senioriteit maakt hierbij geen verschil: junior tot lead staan allemaal 18 tot 20 dagen open. Het soort rol wel.</p>'+foot(3,N));

  // 4 — who is being sought
  var pairs=D.cooccurrence.pairs.slice(0,4).map(function(q){return '<div class="row"><div class="nm">'+esc(q.a+' + '+q.b)+'</div><div class="bar"><i class="nt" style="width:'+(100*q.lift/D.cooccurrence.pairs[0].lift)+'%"></i></div><div class="vl">'+num(q.lift,1)+'×</div></div>';}).join("");
  var PG=(D.providers&&D.providers.groups)||[]; var pmax=PG.length?PG[0].last_share:1;
  var prov=PG.slice(0,6).map(function(g){return '<div class="row"><div class="nm">'+esc(g.provider)+'</div><div class="bar"><i style="width:'+(100*g.last_share/pmax)+'%"></i></div><div class="vl">'+nl(g.last_share,1)+'</div></div>';}).join("");
  S.push(top()+'<div class="k">Wie er gezocht wordt</div><h2>Meer senior, minder lead. En vacatures worden vager.</h2>'+
    '<div class="grid2">'+
    '<div class="mv up"><div class="kk">Senior-vacatures</div><div class="nn">'+nl(sen[0],0)+' <small>→</small> '+nl(sen[sen.length-1],0)+'</div><div class="tt">van alle AI-vacatures, '+m0+' → '+m1+'.</div></div>'+
    '<div class="mv down"><div class="kk">Lead-vacatures</div><div class="nn">'+nl(lead[0],0)+' <small>→</small> '+nl(lead[lead.length-1],0)+'</div><div class="tt">Samen vrijwel gelijk: het label schuift, niet de instroom. Junior en mid bleven stabiel.</div></div>'+
    '<div class="mv down"><div class="kk">Genoemde tools per vacature</div><div class="nn">'+num(sp.mean_skills[0],2)+' <small>→</small> '+num(sp.mean_skills[sp.mean_skills.length-1],2)+'</div><div class="tt">Werkgevers noemen minder concrete technologieën. De teksten worden niet korter, wel vager.</div></div>'+

    '</div>'+
    '<div class="rows"><div class="cap"><span>Welke AI-leverancier wordt genoemd</span><span>aandeel vacatures, '+m1+'</span></div>'+prov+'</div>'+
    '<div class="rows"><div class="cap"><span>Wat samen gevraagd wordt</span><span>× vaker dan toeval</span></div>'+pairs+'</div>'+foot(4,N));

  // 5 — the ranking + where to look further
  var t8=idx.skills.slice(0,8),mx=last(t8[0]);
  var rows5=t8.map(function(r){var cls=r.robust?(r.trend.slope_pp>0?"up":"down"):"";var tag=r.robust?'<span class="tag '+cls+'">'+(r.trend.slope_pp>0?"in opkomst":"verdwijnt")+'</span>':"";
    return '<div class="row"><div class="nm">'+esc(r.skill)+tag+'</div><div class="bar"><i class="'+cls+'" style="width:'+(100*last(r)/mx)+'%"></i></div><div class="vl">'+nl(last(r),1)+'</div></div>';}).join("");
  S.push(top()+'<div class="k">De ranglijst</div><h2>De acht meest gevraagde AI-technologieën, '+m1+' 2026</h2>'+
    '<div class="rows"><div class="cap"><span>Aandeel van de vacatures dat het noemt</span><span>top 8 van '+idx.skills.length+'</span></div>'+rows5+'</div>'+
    '<div class="cta"><div class="u">hoeberigs.github.io/nl-ai-skill-index</div><div class="s">Alle cijfers, de volledige ranglijst en de methode. Elke trend is statistisch getoetst; alleen wat overeind blijft staat hier. Wekelijks ververst.</div></div>'+foot(5,N));

  document.getElementById("deck").innerHTML=S.map(function(h){return '<section class="slide">'+h+'</section>';}).join("");
  var q=/[?&]slide=(\d+)/.exec(location.search);
  if(q){document.body.classList.add("one");var n=parseInt(q[1],10)-1;
    document.querySelectorAll(".slide")[n].classList.add("show");}
});
})();
</script>
</html>
