<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>NL AI Skill Index — LinkedIn one-pager</title>
<link href="https://fonts.googleapis.com/css2?family=Anybody:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#101214;--bg2:#171a1d;--hair:#2a2f34;--ink:#eceadf;--ink2:#b9b5a6;--ink3:#8b8779;
      --rise:#3ddc97;--fall:#ff8a5b;--neutral:#7ab8ff}
html,body{width:1080px;height:1350px;overflow:hidden;background:var(--bg)}
body{font-family:'Anybody',sans-serif;color:var(--ink);font-variant-numeric:tabular-nums;
     -webkit-font-smoothing:antialiased;padding:52px 64px 48px;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:baseline;font-size:19px;
     letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);padding-bottom:18px;
     border-bottom:2px solid var(--ink)}
.top b{color:var(--ink);font-weight:700}
h1{font-size:60px;font-weight:800;line-height:1.02;letter-spacing:-.028em;margin-top:28px;max-width:18ch}
.sub{margin-top:16px;font-size:22px;line-height:1.38;color:var(--ink2);max-width:44ch}
.sub b{color:var(--ink);font-weight:600}

.movers{margin-top:26px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.mv{background:var(--bg2);border-left:5px solid var(--hair);padding:16px 20px 14px}
.mv.up{border-color:var(--rise)} .mv.down{border-color:var(--fall)}
.mv .k{font-size:18px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3)}
.mv .n{margin-top:6px;font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}
.mv.up .n{color:var(--rise)} .mv.down .n{color:var(--fall)}
.mv .n small{font-size:22px;color:var(--ink2);font-weight:500;letter-spacing:0}
.mv .t{margin-top:6px;font-size:17px;color:var(--ink2);line-height:1.3}

.rank{margin-top:24px;flex:1;min-height:0}
.cap{display:flex;justify-content:space-between;font-size:18px;letter-spacing:.12em;
     text-transform:uppercase;color:var(--ink3);padding-bottom:10px;border-bottom:1px solid var(--hair)}
.row{display:grid;grid-template-columns:220px 1fr 88px;gap:14px;align-items:center;padding:6px 0;
     border-bottom:1px solid var(--hair);font-size:20px}
.row .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:14px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-left:9px;padding:2px 7px;border-radius:2px}
.tag.up{background:rgba(61,220,151,.16);color:var(--rise)} .tag.down{background:rgba(255,138,91,.16);color:var(--fall)}
.bar{height:15px;background:var(--bg2);border-radius:2px;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink3);border-radius:2px;display:block}
.bar i.up{background:var(--rise)} .bar i.down{background:var(--fall)}
.vl{text-align:right;font-weight:700}

.foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:18px;padding-top:14px;
      border-top:2px solid var(--ink);font-size:19px;color:var(--ink3);letter-spacing:.06em}
.foot b{color:var(--ink);font-weight:600;letter-spacing:0;font-size:22px}
.foot .r{text-align:right;line-height:1.5}
</style>
</head>
<body>
<div class="top"><span><b>NL AI Skill Index</b></span><span id="meta">…</span></div>
<h1 id="kop">…</h1>
<p class="sub" id="sub">…</p>
<div class="movers" id="movers"></div>
<div class="rank">
  <div class="cap"><span id="capL">…</span><span id="capR">…</span></div>
  <div id="rows"></div>
</div>
<div class="foot">
  <div><b>hoeberigs.github.io/nl-ai-skill-index</b><br>bronnen: LinkedIn en Jobbird · open data · open code · wekelijks ververst</div>
  <div class="r" id="footR">…</div>
</div>
<script>
(function(){
function el(i){return document.getElementById(i);}
function nl(x,d){return (100*x).toFixed(d==null?1:d).replace(".",",")+"%";}
function num(x,d){return Number(x).toFixed(d).replace(".",",");}
var M=["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
function mon(m){return M[parseInt(m.slice(5,7),10)-1];}
fetch("data.json",{cache:"no-store"}).then(function(r){return r.json();}).then(function(D){
  var p=D.panel,idx=D.skill_index.adverts,sp=D.skill_index.specificity;
  var m0=mon(idx.months[0]),m1=mon(idx.months[idx.months.length-1]);
  el("meta").textContent=p.n_identities.toLocaleString("nl-NL")+" vacatures · "+p.n_runs+" dagelijkse metingen";
  el("kop").textContent="Agents zijn de meest gevraagde AI-vaardigheid van Nederland geworden";
  var ris=idx.skills.filter(function(r){return r.robust&&r.trend.slope_pp>0;});
  var fal=idx.skills.filter(function(r){return r.robust&&r.trend.slope_pp<0;});
  var v0=sp.mean_skills[0],v1=sp.mean_skills[sp.mean_skills.length-1];
  el("sub").innerHTML="Zes maanden lang elke dag de Nederlandse vacaturesites gemeten. "+
    "<b>"+ris.map(function(r){return r.skill;}).join(", ")+"</b> is in opkomst; <b>"+fal.map(function(r){return r.skill;}).join(" en ")+"</b> verdwijnen uit de vacaturetekst. "+
    "De andere technologieën bleven in grote lijnen gelijk. Tegelijk noemt een vacature <b>minder</b> concrete tools dan in "+m0+".";

  var cards=[];
  ris.slice(0,1).forEach(function(r){cards.push({cls:"up",k:r.skill+" · stijgt",
    n:nl(r.shares[0],1)+' <small>→</small> '+nl(r.shares[r.shares.length-1],1),
    t:"van de vacatures vraagt om agents, "+m0+" → "+m1+". Verdubbeld in vijf maanden."});});
  fal.slice(0,1).forEach(function(r){cards.push({cls:"down",k:r.skill+" · daalt",
    n:nl(r.shares[0],1)+' <small>→</small> '+nl(r.shares[r.shares.length-1],1),
    t:"Werkgevers gebruiken nieuwere woorden voor hetzelfde werk."});});
  cards.push({cls:"down",k:"tools per vacature",n:num(v0,2)+' <small>→</small> '+num(v1,2),
    t:"Vacatures worden vager over tooling, niet korter."});
  var cs=D.survival_by_cluster.slice().sort(function(a,b){return b.rmst_90-a.rmst_90;});
  cards.push({cls:"up",k:"langst open",n:num(cs[0].rmst_90,0)+' <small>dagen</small>',
    t:cs[0].name+"-vacatures staan het langst open; uitzendwerk sluit in "+num(cs[cs.length-1].rmst_90,0)+"."});
  el("movers").innerHTML=cards.map(function(c){return '<div class="mv '+c.cls+'"><div class="k">'+c.k+
    '</div><div class="n">'+c.n+'</div><div class="t">'+c.t+'</div></div>';}).join("");

  var top=idx.skills.slice(0,8),max=top[0].shares[top[0].shares.length-1];
  el("capL").textContent="Aandeel van de vacatures dat het noemt · "+m1;
  el("capR").textContent="top "+top.length+" van "+idx.skills.length;
  el("rows").innerHTML=top.map(function(r){
    var v=r.shares[r.shares.length-1],cls=r.robust?(r.trend.slope_pp>0?"up":"down"):"";
    var tag=r.robust?'<span class="tag '+cls+'">'+(r.trend.slope_pp>0?"in opkomst":"verdwijnt")+'</span>':"";
    return '<div class="row"><div class="nm">'+r.skill+tag+'</div><div class="bar"><i class="'+cls+'" style="width:'+(100*v/max)+'%"></i></div><div class="vl">'+nl(v,1)+'</div></div>';
  }).join("");
  el("footR").innerHTML=p.first_run.slice(0,7)+" t/m "+p.last_run.slice(0,7)+"<br>"+
    "elke trend statistisch getoetst · methode op de site";
});
})();
</script>
</body>
</html>
